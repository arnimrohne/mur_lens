# Erzeugt ein Lernvideo „Gazet Morisyen erklärt“ (Modul in sendung/lernvideos/) in DE/EN/FR und lädt es privat
# auf YouTube hoch (direkt in den Kanal, keine Playlist). Nur von Hand startbar.
name: Lernvideo

on:
  workflow_dispatch:
    inputs:
      video:
        description: 'Video (Modul in sendung/lernvideos/, z. B. wasser)'
        required: true
        default: wasser
      sprachen:
        description: 'Sprachen (kommagetrennt)'
        required: true
        default: de,en,fr
      hochladen:
        description: 'Auf YouTube hochladen (aus = nur Test, Video als Artefakt)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lernvideo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sendung/requirements-lernvideo.txt

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fluidsynth fluid-soundfont-gm libcairo2-dev pkg-config
          pip install -r sendung/requirements-lernvideo.txt

      - name: Stimmen aus dem Cache
        id: stimmen
        uses: actions/cache@v4
        with:
          path: stimmen
          key: piper-stimmen-thorsten-high-siwis-medium-cori-high-v1

      - name: Stimmen herunterladen
        if: steps.stimmen.outputs.cache-hit != 'true'
        run: |
          mkdir -p stimmen
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main
          for v in de/de_DE/thorsten/high/de_DE-thorsten-high fr/fr_FR/siwis/medium/fr_FR-siwis-medium en/en_GB/cori/high/en_GB-cori-high; do
            n=$(basename "$v")
            curl -sfL -o "stimmen/$n.onnx" "$B/$v.onnx"
            curl -sfL -o "stimmen/$n.onnx.json" "$B/$v.onnx.json"
          done

      - name: Videos und Vorschaubilder erzeugen
        env:
          VIDEO: ${{ inputs.video }}
          SPRACHEN: ${{ inputs.sprachen }}
        run: |
          cd sendung
          for s in ${SPRACHEN//,/ }; do
            python lernvideo.py --video "$VIDEO" --sprache "$s" --stimmen ../stimmen --ausgabe ../ausgabe
            python lernvideo_vorschau.py --video "$VIDEO" --sprache "$s" --ziel "../ausgabe/vorschau-$s.png"
          done

      - name: Auf YouTube hochladen
        if: inputs.hochladen
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO: ${{ inputs.video }}
          SPRACHEN: ${{ inputs.sprachen }}
        run: cd sendung && python lernvideo_upload.py --video "$VIDEO" --ausgabe ../ausgabe --sprachen "$SPRACHEN"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lernvideo-${{ inputs.video }}
          path: ausgabe/
          retention-days: 14
          compression-level: 0
